# A small C interface over DeepFilterNet 3 for room voice. The model is compiled in, and every call catches
# panics so a failure inside the model reports an error instead of crashing the app.
[package]
name = "blackpearl_deepfilter"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[lib]
name = "deepfilter"
crate-type = ["cdylib"]

[dependencies]
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d8309e0935d165700c91da9de862a99c31", default-features = false, features = ["tract", "default-model"] }
ndarray = "0.15"

[profile.release]
opt-level = 3
lto = "thin"

strip = true
panic = "unwind"
