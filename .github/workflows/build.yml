name: Build and release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Resolve version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag must match Version in Directory.Build.props' }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Release tags must be vMAJOR.MINOR.PATCH' }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
      # Voice processing libraries are built from pinned sources (see Watchroom.Desktop.csproj); reuse them while those are unchanged.
      - uses: actions/cache@v4
        with:
          path: .tools/native/*.dll
          key: voice-native-${{ hashFiles('src/native/**', 'src/Watchroom.Desktop/Watchroom.Desktop.csproj') }}
      - name: Restore and build
        shell: pwsh
        run: |
          dotnet restore Watchroom.slnx --locked-mode
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build Watchroom.slnx -c Release --no-restore -p:Version=$env:APP_VERSION
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Update safety checks
        run: dotnet run --project tests/Watchroom.UpdateChecks -c Release
      - name: Metadata regression checks
        run: dotnet run --project tests/Watchroom.Smoke -c Release -- --metadata-cache
      - name: TMDB access and retention checks
        run: dotnet run --project tests/Watchroom.Smoke -c Release -- --tmdb-access
      - name: Desktop regression checks
        run: dotnet run --project tests/Watchroom.DesktopChecks -c Release
      - name: Home regression checks
        run: dotnet run --project tests/Watchroom.DesktopChecks -c Release -- --home
      - name: UI findings regression checks
        run: dotnet run --project tests/Watchroom.DesktopChecks -c Release -- --ui-findings
      - name: Guest library layout checks
        run: dotnet run --project tests/Watchroom.DesktopChecks -c Release -- --guest-library-layout
      - name: Host library browsing checks
        run: dotnet run --project tests/Watchroom.DesktopChecks -c Release -- --host-library-browse
      - name: Shared library transport checks
        run: dotnet run --project tests/Watchroom.Smoke -c Release -- --shared-library
      - name: Player layout checks
        run: dotnet run --project tests/Watchroom.DesktopChecks -c Release -- --player-layout
      - name: Track language detection checks
        run: dotnet run --project tests/Watchroom.DesktopChecks -c Release -- --language-detection
      - name: Voice processing checks
        run: dotnet run --project tests/Watchroom.DesktopChecks -c Release -- --voice-processing
      - name: Episode thumbnail checks
        run: dotnet run --project tests/Watchroom.DesktopChecks -c Release -- --video-frames
      - name: Full playback and room checks
        run: dotnet run --project tests/Watchroom.Smoke -c Release -- artifacts/release-smoke
      - name: Publish Windows app
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          WATCHROOM_TMDB_API_KEY: ${{ secrets.WATCHROOM_TMDB_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $keyFile = Join-Path $env:RUNNER_TEMP "watchroom-tmdb-key.txt"
          if ([string]::IsNullOrWhiteSpace($env:WATCHROOM_TMDB_API_KEY)) { throw "WATCHROOM_TMDB_API_KEY repository secret is required for packaged builds." }
          [IO.File]::WriteAllText($keyFile, $env:WATCHROOM_TMDB_API_KEY.Trim())
          $env:WATCHROOM_TMDB_KEY_FILE = $keyFile
          dotnet publish src/Watchroom.Desktop -c Release -r win-x64 --self-contained true -o artifacts/Watchroom -p:Version=$env:APP_VERSION -p:VlcWindowsX86Enabled=false -p:VlcWindowsArm64Enabled=false -p:PublishReadyToRun=true
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/package.ps1 -SkipPublish -Version $env:APP_VERSION
          ./scripts/update-package-checks.ps1
          ./scripts/package-updates.ps1 -Version $env:APP_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: Watchroom-windows-${{ env.APP_VERSION }}
          path: |
            artifacts/Watchroom-Setup-*-win-x64.exe
            artifacts/Watchroom-Update-*-win-x64.exe
            artifacts/Watchroom-files-*-win-x64.txt
          retention-days: 14
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @("artifacts/Watchroom-Setup-$env:APP_VERSION-win-x64.exe", "artifacts/Watchroom-files-$env:APP_VERSION-win-x64.txt") +
            @(Get-ChildItem "artifacts/Watchroom-Update-*-to-$env:APP_VERSION-win-x64.exe" | ForEach-Object { $_.FullName })
          $files | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant())  $(Split-Path $_ -Leaf)" } | Set-Content artifacts/SHA256SUMS.txt
          gh release create $env:GITHUB_REF_NAME @files artifacts/SHA256SUMS.txt --verify-tag --draft --title "Watchroom $env:APP_VERSION" --generate-notes
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
