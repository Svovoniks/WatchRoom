name: Build and release
# A pull request that raises the version runs the checks and builds the installers at once, on up to four runners. Its tag
# then publishes those exact installers: ship.ps1 merges only heads that contain master and tags a squash commit with
# the head's tree, so the tag run finds the passing pull request run with that tree and reuses its checks and
# installers. A tag without such a run checks and builds itself. Pushes to master only keep the build caches warm for
# pull requests, which cannot share their own caches.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      checked: ${{ steps.plan.outputs.checked }}
      package: ${{ steps.plan.outputs.package }}
      artifact: ${{ steps.plan.outputs.artifact }}
      prebuilt: ${{ steps.plan.outputs.prebuilt }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag must match Version in Directory.Build.props' }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Release tags must be vMAJOR.MINOR.PATCH' }
          "version=$version" >> $env:GITHUB_OUTPUT
      # Update installers are built from every recent release up to the latest one, so the artifact name records which
      # release that was. A tag reuses only installers built against the release that is still the latest.
      - name: Plan checks and packaging
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          EVENT: ${{ github.event_name }}
          SAME_REPOSITORY: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name | ltrimstr("v")' 2>/dev/null) || latest=none
          artifact="BlackPearl-windows-$VERSION-after-$latest"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          unreleased=false
          if [ "$latest" = none ] || { [ "$latest" != "$VERSION" ] && [ "$(printf '%s\n%s\n' "$latest" "$VERSION" | sort -V | tail -n 1)" = "$VERSION" ]; }; then unreleased=true; fi
          prebuilt=
          # A pull request run checks the head merged into master, which has the head's own tree when the head contains master.
          if [ "$EVENT" != pull_request ]; then
            tree=$(git rev-parse 'HEAD^{tree}')
            runs=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs" -f event=pull_request -f status=success -f per_page=100 \
              --jq ".workflow_runs[] | select(.head_commit.tree_id == \"$tree\") | \"\(.id) \(.head_repository.full_name)\"")
            if [ -n "$runs" ]; then
              echo "Tree $tree already passed every check in run $(echo "$runs" | head -n 1 | cut -d ' ' -f 1)"
              echo "checked=true" >> "$GITHUB_OUTPUT"
            else
              echo "No passing pull request run has tree $tree, so the checks run here."
            fi
            if [ "$GITHUB_REF_TYPE" = tag ] && [ -n "$runs" ]; then
              while read -r id repository; do
                [ "$repository" = "$GITHUB_REPOSITORY" ] || continue
                found=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" -f name="$artifact" --jq '[.artifacts[] | select(.expired | not)] | length')
                if [ "$found" != 0 ]; then prebuilt=$id; break; fi
              done <<< "$runs"
            fi
          fi
          case "$EVENT" in
            pull_request) package=$([ "$SAME_REPOSITORY" = true ] && [ "$unreleased" = true ] && echo true || echo false) ;;
            workflow_dispatch) package=true ;;
            *) package=$([ "$GITHUB_REF_TYPE" = tag ] && [ -z "$prebuilt" ] && echo true || echo false) ;;
          esac
          if [ -n "$prebuilt" ]; then echo "Publishing $artifact from run $prebuilt"; echo "prebuilt=$prebuilt" >> "$GITHUB_OUTPUT"; fi
          echo "Version $VERSION, latest release $latest, packaging here: $package"
          echo "package=$package" >> "$GITHUB_OUTPUT"

  checks:
    needs: plan
    if: needs.plan.outputs.checked != 'true'
    name: checks (${{ matrix.lane }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: [desktop, smoke-1, smoke-2]
    env:
      APP_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: .nuget/packages
          key: nuget-${{ hashFiles('**/packages.lock.json') }}
      - uses: actions/cache@v4
        with:
          path: .tools/models
          key: models-${{ hashFiles('src/BlackPearl.Desktop/BlackPearl.Desktop.csproj') }}
      # Voice processing libraries are built from pinned sources (see BlackPearl.Desktop.csproj); reuse them while those are unchanged.
      - uses: actions/cache@v4
        with:
          path: .tools/native/*.dll
          key: voice-native-${{ hashFiles('src/native/**', 'src/BlackPearl.Desktop/BlackPearl.Desktop.csproj') }}
      - name: Restore and build
        shell: pwsh
        run: |
          dotnet restore BlackPearl.slnx --locked-mode
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build BlackPearl.slnx -c Release --no-restore -p:Version=$env:APP_VERSION
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Update safety checks
        if: matrix.lane == 'desktop'
        run: dotnet run --project tests/BlackPearl.UpdateChecks -c Release --no-build
      - name: TMDB access and retention checks
        if: matrix.lane == 'desktop'
        run: dotnet run --project tests/BlackPearl.Smoke -c Release --no-build -- --tmdb-access
      - name: Desktop regression checks
        if: matrix.lane == 'desktop'
        run: dotnet run --project tests/BlackPearl.DesktopChecks -c Release --no-build
      - name: Acquisition dialog layout checks
        if: matrix.lane == 'desktop'
        run: dotnet run --project tests/BlackPearl.DesktopChecks -c Release --no-build -- --acquisition-layout
      - name: Home regression checks
        if: matrix.lane == 'desktop'
        run: dotnet run --project tests/BlackPearl.DesktopChecks -c Release --no-build -- --home
      - name: UI findings regression checks
        if: matrix.lane == 'desktop'
        run: dotnet run --project tests/BlackPearl.DesktopChecks -c Release --no-build -- --ui-findings
      - name: Guest library layout checks
        if: matrix.lane == 'desktop'
        run: dotnet run --project tests/BlackPearl.DesktopChecks -c Release --no-build -- --guest-library-layout
      - name: Host library browsing checks
        if: matrix.lane == 'desktop'
        run: dotnet run --project tests/BlackPearl.DesktopChecks -c Release --no-build -- --host-library-browse
      - name: Player layout checks
        if: matrix.lane == 'desktop'
        run: dotnet run --project tests/BlackPearl.DesktopChecks -c Release --no-build -- --player-layout
      - name: Metadata picker checks
        if: matrix.lane == 'desktop'
        run: dotnet run --project tests/BlackPearl.DesktopChecks -c Release --no-build -- --metadata-picker
      - name: Room playback status checks
        if: matrix.lane == 'desktop'
        run: dotnet run --project tests/BlackPearl.DesktopChecks -c Release --no-build -- --room-playback-status
      - name: Track language detection checks
        if: matrix.lane == 'desktop'
        run: dotnet run --project tests/BlackPearl.DesktopChecks -c Release --no-build -- --language-detection
      - name: Voice processing checks
        if: matrix.lane == 'desktop'
        run: dotnet run --project tests/BlackPearl.DesktopChecks -c Release --no-build -- --voice-processing
      - name: Episode thumbnail checks
        if: matrix.lane == 'desktop'
        run: dotnet run --project tests/BlackPearl.DesktopChecks -c Release --no-build -- --video-frames
      # The full smoke suite in two halves of about equal length; the second includes the metadata cache, shared
      # library transport and room checks.
      - name: Full playback and room checks (part ${{ matrix.lane == 'smoke-1' && '1' || '2' }} of 2)
        if: matrix.lane != 'desktop'
        run: dotnet run --project tests/BlackPearl.Smoke -c Release --no-build -- artifacts/release-smoke --part ${{ matrix.lane == 'smoke-1' && '1' || '2' }}

  package:
    needs: plan
    if: needs.plan.outputs.package == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      APP_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      # The pull request head itself, not its merge into master: the tag reuses these installers for the head's tree.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: .nuget/packages
          key: nuget-${{ hashFiles('**/packages.lock.json') }}
      - uses: actions/cache@v4
        with:
          path: .tools/models
          key: models-${{ hashFiles('src/BlackPearl.Desktop/BlackPearl.Desktop.csproj') }}
      - uses: actions/cache@v4
        with:
          path: .tools/native/*.dll
          key: voice-native-${{ hashFiles('src/native/**', 'src/BlackPearl.Desktop/BlackPearl.Desktop.csproj') }}
      - name: Publish Windows app
        shell: pwsh
        env:
          # The secret may still have its name from before the app was renamed from Watchroom.
          BLACKPEARL_TMDB_API_KEY: ${{ secrets.BLACKPEARL_TMDB_API_KEY || secrets.WATCHROOM_TMDB_API_KEY }}
        run: |
          $keyFile = Join-Path $env:RUNNER_TEMP "blackpearl-tmdb-key.txt"
          if ([string]::IsNullOrWhiteSpace($env:BLACKPEARL_TMDB_API_KEY)) { throw "BLACKPEARL_TMDB_API_KEY repository secret is required for packaged builds." }
          [IO.File]::WriteAllText($keyFile, $env:BLACKPEARL_TMDB_API_KEY.Trim())
          $env:BLACKPEARL_TMDB_KEY_FILE = $keyFile
          dotnet publish src/BlackPearl.Desktop -c Release -r win-x64 --self-contained true -o artifacts/BlackPearl -p:Version=$env:APP_VERSION -p:VlcWindowsX86Enabled=false -p:VlcWindowsArm64Enabled=false -p:PublishReadyToRun=true
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/package.ps1 -SkipPublish -Version $env:APP_VERSION -Step Files
          # The full installer compiles beside the update installers; both read the staged app folder.
          $root = $PWD.Path
          $installer = Start-Job { Set-Location $using:root; ./scripts/package.ps1 -SkipPublish -Version $env:APP_VERSION -Step Installer | Out-String }
          ./scripts/update-package-checks.ps1
          ./scripts/package-updates.ps1 -Version $env:APP_VERSION
          Wait-Job $installer | Out-Null
          Receive-Job $installer
          if ($installer.State -ne 'Completed') { throw 'Full installer compilation failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.plan.outputs.artifact }}
          path: |
            artifacts/BlackPearl-Setup-*-win-x64.exe
            artifacts/BlackPearl-Update-*-win-x64.exe
            artifacts/BlackPearl-files-*-win-x64.txt
          if-no-files-found: error
          retention-days: 14
          # Installers are already compressed.
          compression-level: 0

  # Pull requests read caches saved on master but not each other's, so master keeps one of each. A cache that is
  # already there is only looked up, not downloaded.
  caches:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: nuget
        with:
          path: .nuget/packages
          key: nuget-${{ hashFiles('**/packages.lock.json') }}
          lookup-only: true
      - uses: actions/cache@v4
        id: models
        with:
          path: .tools/models
          key: models-${{ hashFiles('src/BlackPearl.Desktop/BlackPearl.Desktop.csproj') }}
          lookup-only: true
      - uses: actions/cache@v4
        id: native
        with:
          path: .tools/native/*.dll
          key: voice-native-${{ hashFiles('src/native/**', 'src/BlackPearl.Desktop/BlackPearl.Desktop.csproj') }}
          lookup-only: true
      - uses: actions/setup-dotnet@v4
        if: steps.nuget.outputs.cache-hit != 'true' || steps.models.outputs.cache-hit != 'true' || steps.native.outputs.cache-hit != 'true'
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build what is missing
        if: steps.nuget.outputs.cache-hit != 'true' || steps.models.outputs.cache-hit != 'true' || steps.native.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          dotnet restore BlackPearl.slnx --locked-mode
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build src/BlackPearl.Desktop -c Release --no-restore
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  release:
    needs: [plan, checks, package]
    # Runs after skipped checks only when the plan found that they already passed on this tree, and after skipped
    # packaging only when that passing run built the installers.
    if: >-
      always() && startsWith(github.ref, 'refs/tags/') && needs.plan.result == 'success' &&
      (needs.package.result == 'success' || (needs.package.result == 'skipped' && needs.plan.outputs.prebuilt != '')) &&
      (needs.checks.result == 'success' || (needs.checks.result == 'skipped' && needs.plan.outputs.checked == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      APP_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.plan.outputs.artifact }}
          path: artifacts
          run-id: ${{ needs.plan.outputs.prebuilt || github.run_id }}
          github-token: ${{ github.token }}
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $files = @("artifacts/BlackPearl-Setup-$env:APP_VERSION-win-x64.exe", "artifacts/BlackPearl-files-$env:APP_VERSION-win-x64.txt") +
            @(Get-ChildItem "artifacts/BlackPearl-Update-*-to-$env:APP_VERSION-win-x64.exe" | ForEach-Object { $_.FullName })
          # Installations from before the rename (Watchroom 0.3.90 and older) look for Watchroom-Setup-* and accept
          # downloads only from Svovoniks/WatchRoom, so while the repository still has that name, the full installer is
          # also published under its old name for them to update to BlackPearl. No update installer is built from a
          # version that old any more, so they take the full installer. After the rename they cannot update anyway.
          if ($env:GH_REPO -ceq 'Svovoniks/WatchRoom') {
            $setup = $files[0]
            $legacy = Join-Path (Split-Path $setup -Parent) ((Split-Path $setup -Leaf) -replace '^BlackPearl-', 'Watchroom-')
            Copy-Item $setup $legacy
            $files += $legacy
          }
          $files | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant())  $(Split-Path $_ -Leaf)" } | Set-Content artifacts/SHA256SUMS.txt
          gh release create $env:GITHUB_REF_NAME @files artifacts/SHA256SUMS.txt --verify-tag --draft --title "BlackPearl $env:APP_VERSION" --generate-notes
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
