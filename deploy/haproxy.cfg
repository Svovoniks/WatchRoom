# Shares public TCP 443 between HTTPS (Caddy) and SSH, which some networks only allow on 443.
# TLS connections go to Caddy with the PROXY protocol so rate limits see the real client address;
# everything else, including SSH clients that wait for the server banner, goes to sshd after the delay.
global
    log /dev/log local0
    maxconn 2000

defaults
    mode tcp
    log global
    option dontlognull
    timeout connect 5s
    timeout client 12h
    timeout server 12h

frontend multiplex
    bind "${MULTIPLEX_BIND}"
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    # sshd only sees loopback here, so limit SSH connection attempts per client address instead.
    stick-table type ip size 100k expire 10m store conn_rate(1m)
    tcp-request content track-sc0 src
    tcp-request content reject if { sc_conn_rate(0) gt 10 }
    tcp-request content accept if { req.payload(0,4) -m bin 5353482d }
    use_backend https if { req.ssl_hello_type 1 }
    default_backend ssh

backend https
    server caddy 127.0.0.1:8443 send-proxy-v2

backend ssh
    server sshd 127.0.0.1:22
